<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Docs{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/pygments.css">
</head>
<body class="layout">
    <nav class="sidebar">
        <a href="/admin" class="btn" style="margin-left:8px; background:#333; color:#ccc;">Admin</a>
        <h2><a href="/">Docs</a></h2>
        <ul>
        {% for doc in docs %}
            <li><a href="/view/{{ doc }}">{{ doc }}</a></li>
        {% endfor %}
        </ul>
    </nav>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
