{% extends "base.html" %}
{% block title %}Edit {{ filename }}{% endblock %}
{% block content %}
    <h1>Edit: {{ filename }}</h1>
    <form method="post" action="/admin/edit/{{ filename }}" class="admin-form">
        <textarea name="content" rows="16">{{ content }}</textarea>
        <button type="submit" class="btn btn-primary">Save</button>
    </form>
{% endblock %}
