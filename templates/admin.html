{% extends "base.html" %}
{% block title %}Admin{% endblock %}
{% block content %}
    <div class="admin-header">
        <h1>Manage Docs</h1>
        <a href="/admin/new" class="btn btn-primary">+ New Doc</a>
    </div>
    <table class="doc-table">
        <thead>
            <tr>
                <th>Name</th>
                <th class="actions">Actions</th>
            </tr>
        </thead>
        <tbody>
        {% for doc in docs %}
            <tr>
                <td>{{ doc }}</td>
                <td class="actions">
                    <a href="/view/{{ doc }}">View</a>
                    <a href="/admin/edit/{{ doc }}">Edit</a>
                    <form method="post" action="/admin/delete/{{ doc }}" style="display:inline"
                          onsubmit="return confirm('Delete {{ doc }}?')">
                        <button type="submit" class="btn-danger btn">Delete</button>
                    </form>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
{% endblock %}
